plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.arang'
version = '0.0.1-SNAPSHOT'
description = 'Arang Producer Intake (P1) — skeleton spike'

java {
    toolchain {
        // Modern stack per project steering: Java 25 (LTS). Toolchain pins the compile/run JDK.
        languageVersion = JavaLanguageVersion.of(25)
    }
}

// scripts/dev.sh passes -PdevBuildDir=build-dev so dev compiles never touch build/ (used by older runs).
if (project.hasProperty('devBuildDir')) {
    layout.buildDirectory = layout.projectDirectory.dir(project.property('devBuildDir') as String)
}

repositories {
    mavenCentral()
}

dependencies {
    // Web + JPA + validation (P1 intake, review/edit endpoints, incoming-data validation)
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    // Actuator for the health check (SDD T1)
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    // Flyway migrations (Boot 4 split Flyway autoconfig into its own starter; flyway-core alone
    // does NOT trigger autoconfiguration). The starter brings autoconfig + flyway-core.
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.flywaydb:flyway-mysql'

    // MySQL driver for the prod/dev profile
    runtimeOnly 'com.mysql:mysql-connector-j'
    // P2.1 read-only place file (ARANG-SDD-P2-1 §3.4, T4). Version pinned in T1; SHA-1 b74a59de3ae1dbab7c550fe7c46099980261a676.
    runtimeOnly 'org.xerial:sqlite-jdbc:3.54.1.0'
    // H2 for tests so the skeleton boots without a live MySQL
    testRuntimeOnly 'com.h2database:h2'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform {
        // The default test run stays MySQL-free (H2 only). The mysql-it tag runs via mysqlIntegrationTest.
        excludeTags 'mysql-it'
    }
}

// Real-MySQL integration tests (TTP-D3). Run by hand before merging the waitlist tasks:
//   ./gradlew mysqlIntegrationTest        (needs MySQL + the arang_dev database)
// Overridable via ARANG_DB_URL/USER/PASSWORD env vars (defaults to local arang_dev).
tasks.register('mysqlIntegrationTest', Test) {
    description = 'Run @Tag("mysql-it") tests against a real MySQL (arang_dev). Not part of `test`.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'mysql-it'
    }
    systemProperty 'spring.profiles.active', 'mysql-it'
}

// ---- Same-origin SPA build (DD-P2-6) --------------------------------------
// Builds the React SPA (web/) and copies its dist into src/main/resources/static so Spring Boot
// serves the SPA and the /api endpoints from one origin (no CORS). Opt-in to keep normal backend
// builds fast and Node-independent: run with -PbuildSpa. The node bin dir can be overridden with
// -PnodeBin=/path/to/node/bin (defaults to the prebuilt /tmp/node20/bin used in this environment).
def nodeBin = project.findProperty('nodeBin') ?: '/tmp/node20/bin'

tasks.register('buildSpa', Exec) {
    description = 'Build the React SPA (web/) with Vite.'
    workingDir = file('web')
    environment 'PATH', "${nodeBin}:${System.getenv('PATH')}"
    // Prefer the local vite binary (node only — avoids a broken/partial npm, e.g. the /tmp prebuilt
    // whose npm cli.js is missing, DD-P2-1). Only run an install when node_modules is absent, and
    // try npm then a plain node-based install fallback.
    commandLine 'sh', '-c',
        'if [ ! -x node_modules/.bin/vite ]; then ' +
        '  (npm install --no-audit --no-fund >/dev/null 2>&1) || ' +
        '  { echo "npm unavailable/broken — install web/ deps with a working npm, then rerun"; exit 1; }; ' +
        'fi; ' +
        './node_modules/.bin/vite build'
}

tasks.register('copySpa', Copy) {
    description = 'Copy the built SPA into static/ for same-origin serving. Run after buildSpa.'
    dependsOn 'buildSpa'
    from 'web/dist'
    into 'src/main/resources/static'
}
// NOTE: copySpa/buildSpa are intentionally NOT wired into processResources or test — the SPA build
// needs Node, which the backend build/test must not require. Produce the same-origin bundle with an
// explicit step before running the server:
//   ./gradlew copySpa -PbuildSpa -PnodeBin=/path/to/node/bin   (the flag is advisory only now)
//   ./gradlew bootRun
