<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Arang — Producer Console</title>
    <style>
        :root { --bg:#0b141a; --panel:#111b21; --in:#202c33; --out:#005c4b; --txt:#e9edef; --muted:#8696a0; --accent:#00a884; }
        * { box-sizing: border-box; }
        body { margin:0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
               background:var(--bg); color:var(--txt); height:100vh; display:flex; flex-direction:column; }
        header { background:var(--panel); padding:14px 18px; display:flex; align-items:center; gap:12px;
                 border-bottom:1px solid #222d34; }
        header .logo { width:40px; height:40px; border-radius:50%; background:var(--accent);
                       display:grid; place-items:center; font-weight:700; color:#042; }
        header h1 { font-size:1rem; margin:0; } header p { margin:0; color:var(--muted); font-size:.8rem; }
        #chat { flex:1; overflow-y:auto; padding:18px; display:flex; flex-direction:column; gap:10px; }
        .msg { max-width:72%; padding:8px 12px; border-radius:10px; white-space:pre-wrap;
               line-height:1.35; font-size:.95rem; position:relative; }
        .out { align-self:flex-end; background:var(--out); border-bottom-right-radius:2px; }
        .in  { align-self:flex-start; background:var(--in); border-bottom-left-radius:2px; }
        .meta { align-self:center; color:var(--muted); font-size:.78rem; margin:4px 0; }
        .msg a { color:#8ad7ff; }
        .reviewbtn { display:inline-block; margin-top:8px; background:var(--accent); color:#042;
                     padding:6px 12px; border-radius:6px; text-decoration:none; font-weight:600; font-size:.85rem; }
        footer { background:var(--panel); padding:12px; display:flex; gap:10px; border-top:1px solid #222d34; }
        #message { flex:1; resize:none; border:none; border-radius:20px; padding:12px 16px; font-size:.95rem;
                   background:var(--in); color:var(--txt); outline:none; max-height:120px; }
        #send { border:none; background:var(--accent); color:#042; font-weight:700; border-radius:50%;
                width:46px; height:46px; cursor:pointer; font-size:1.2rem; flex:none; }
        #send:disabled { opacity:.5; cursor:default; }
        #attach { border:none; background:var(--in); color:var(--txt); border-radius:50%;
                  width:46px; height:46px; cursor:pointer; font-size:1.2rem; flex:none; }
        .hint { color:var(--muted); font-size:.8rem; }
    </style>
</head>
<body>
<header>
    <div class="logo">A</div>
    <div>
        <h1>Arang Producer Console</h1>
        <p>Send an event like a producer would over WhatsApp</p>
    </div>
</header>

<div id="chat">
    <div class="meta">Type an event below — e.g. “Live jazz Friday 8pm at The Cellar, tickets https://example.com/jazz”.
        Arang will capture it and reply with a review link.</div>
</div>

<footer>
    <input type="file" id="imageFile" accept="image/*" style="display:none"/>
    <button id="attach" title="Upload a flyer image">📎</button>
    <textarea id="message" rows="1" placeholder="Type an event message…" autofocus></textarea>
    <button id="send" title="Send">➤</button>
</footer>

<script>
    const chat = document.getElementById('chat');
    const input = document.getElementById('message');
    const sendBtn = document.getElementById('send');
    const attachBtn = document.getElementById('attach');
    const imageFile = document.getElementById('imageFile');

    function bubble(text, cls, asHtml) {
        const d = document.createElement('div');
        d.className = 'msg ' + cls;
        if (asHtml) d.innerHTML = text; else d.textContent = text;
        chat.appendChild(d);
        chat.scrollTop = chat.scrollHeight;
        return d;
    }
    function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

    async function send() {
        const message = input.value.trim();
        if (!message) return;
        bubble(message, 'out');
        input.value = ''; input.style.height = 'auto';
        sendBtn.disabled = true;
        const typing = bubble('…', 'in');
        try {
            const res = await fetch('/api/producer/message', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message })
            });
            const data = await res.json();
            typing.remove();
            if (!data.ok) { bubble('⚠️ ' + (data.error || 'Something went wrong'), 'in'); return; }
            const replyHtml = escapeHtml(data.reply)
                + '<br/><a class="reviewbtn" href="' + data.reviewPath + '" target="_blank">Open review page →</a>';
            bubble(replyHtml, 'in', true);
            // Option 3: poll for async LLM enrichment and update the conversation when it lands.
            pollEnrichment(data.eventId);
        } catch (e) {
            typing.remove();
            bubble('⚠️ Network error: ' + e.message, 'in');
        } finally {
            sendBtn.disabled = false;
            input.focus();
        }
    }

    async function pollEnrichment(eventId) {
        if (!eventId) return;
        const note = bubble('🧠 Reading your message…', 'meta');
        const started = Date.now();
        const maxMs = 4 * 60 * 1000;   // local model can take a couple minutes
        const intervalMs = 5000;
        const tick = async () => {
            if (Date.now() - started > maxMs) {
                note.textContent = '🧠 Still working — check the review page in a bit.';
                return;
            }
            try {
                const r = await fetch('/api/producer/message/' + eventId + '/status');
                const d = await r.json();
                if (d.ok && d.notEvent) {
                    note.remove();
                    bubble("🤔 That didn't look like an event, so I didn't fill anything in. "
                        + "You can still open the review page and add details.", 'in');
                    return;
                }
                if (d.ok && d.enriched) {
                    note.remove();
                    const lines = ['✅ I read your event as:'];
                    if (d.title)    lines.push('• Title: ' + d.title);
                    if (d.startsAt) lines.push('• Starts: ' + d.startsAt.replace('T', ' '));
                    if (d.location) lines.push('• Location: ' + d.location);
                    lines.push('\nOpen the review page to confirm or edit.');
                    bubble(lines.join('\n'), 'in');
                    return;
                }
            } catch (e) { /* keep polling */ }
            setTimeout(tick, intervalMs);
        };
        setTimeout(tick, intervalMs);
    }

    async function uploadImage(file) {
        bubble('📷 ' + file.name, 'out');
        const typing = bubble('Uploading…', 'in');
        const form = new FormData();
        form.append('file', file);
        try {
            const res = await fetch('/api/producer/image', { method: 'POST', body: form });
            const data = await res.json();
            typing.remove();
            if (!data.ok) { bubble('⚠️ ' + (data.error || 'Upload failed'), 'in'); return; }
            const html = escapeHtml(data.message || 'Got your flyer — reading it now…')
                + '<br/><a class="reviewbtn" href="' + data.reviewPath + '" target="_blank">Open review page →</a>';
            bubble(html, 'in', true);
            pollEnrichment(data.eventId);   // same poll as text → shows deciphered fields when ready
        } catch (e) {
            typing.remove();
            bubble('⚠️ Network error: ' + e.message, 'in');
        }
    }

    attachBtn.addEventListener('click', () => imageFile.click());
    imageFile.addEventListener('change', () => {
        if (imageFile.files && imageFile.files[0]) {
            uploadImage(imageFile.files[0]);
            imageFile.value = '';   // allow re-selecting the same file
        }
    });

    sendBtn.addEventListener('click', send);
    input.addEventListener('keydown', e => {
        if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
    });
    input.addEventListener('input', () => {
        input.style.height = 'auto';
        input.style.height = Math.min(input.scrollHeight, 120) + 'px';
    });
</script>
</body>
</html>
