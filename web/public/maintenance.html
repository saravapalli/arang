<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Arangly — back soon</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet"/>
<style>
  * { box-sizing:border-box; }
  html,body { height:100%; margin:0; }
  body {
    display:flex; align-items:center; justify-content:center; min-height:100vh;
    font-family:'DM Sans',sans-serif; text-align:center;
    background:
      radial-gradient(1000px 520px at 50% 18%, #fbe6d7 0%, rgba(251,230,215,0) 60%),
      radial-gradient(900px 520px at 10% 110%, #e7eadf 0%, rgba(231,234,223,0) 55%),
      #f5f3ed;
    color:#22263b;
  }
  .wrap { width:min(560px, calc(100% - 48px)); padding:40px 0; }
  .logo { display:inline-flex; align-items:center; gap:11px; color:#22263b; font-family:Manrope; font-size:24px; font-weight:800; letter-spacing:-.05em; }
  .flower { position:relative; width:30px; height:30px; transform:rotate(45deg); }
  .flower i { position:absolute; width:14px; height:14px; border-radius:9px 9px 2px 9px; background:#ff694a; }
  .flower i:nth-child(1){top:0;left:0}.flower i:nth-child(2){top:0;right:0;transform:rotate(90deg);background:#4951d7}
  .flower i:nth-child(3){bottom:0;right:0;transform:rotate(180deg);background:#f7b632}.flower i:nth-child(4){bottom:0;left:0;transform:rotate(270deg);background:#4aa47b}
  .overline { margin:34px 0 14px; color:#7a7c75; font-size:11px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; }
  .overline span { color:#ff694a; }
  h1 { margin:0; font-family:Manrope; font-size:clamp(40px,6vw,64px); font-weight:700; letter-spacing:-.06em; line-height:1; }
  h1 em { color:#ff694a; font-family:Georgia,serif; font-weight:400; }
  p.sub { max-width:460px; margin:22px auto 0; color:#6e716d; font-size:16px; line-height:1.65; }
  .dots { display:flex; gap:8px; justify-content:center; margin-top:30px; }
  .dots i { width:9px; height:9px; border-radius:50%; background:#d8d5cc; animation:pulse 1.4s infinite; }
  .dots i:nth-child(2){ animation-delay:.2s } .dots i:nth-child(3){ animation-delay:.4s }
  @keyframes pulse { 0%,100%{background:#d8d5cc;transform:scale(1)} 50%{background:#ff694a;transform:scale(1.25)} }
  .note { margin-top:30px; display:inline-flex; align-items:center; gap:8px; padding:9px 15px; color:#8a6d2f; border:1px solid rgba(255,219,102,.6); border-radius:999px; background:rgba(255,219,102,.25); font-size:12.5px; font-weight:600; }
  .foot { margin-top:34px; color:#a4a69e; font-size:10px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; }
  svg { width:16px; height:16px; }
</style>
</head>
<body>
  <div class="wrap">
    <span class="logo"><span class="flower"><i></i><i></i><i></i><i></i></span>arangly</span>
    <p class="overline"><span>Back very soon</span> · your town</p>
    <h1>We're tidying up<br/><em>your town.</em></h1>
    <p class="sub">Arangly is getting a quick update so your local events look their best. Grab a coffee — we'll be live again in a few minutes.</p>
    <div class="dots"><i></i><i></i><i></i></div>
    <div class="note">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg>
      Scheduled maintenance · check back shortly
    </div>
    <div class="foot">Arangly · made for towns, by locals</div>
  </div>
</body>
</html>
